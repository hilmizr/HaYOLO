# YOLOv11 object-detection backbone-and-neck variant with GSConv-based blocks
# File: yolov11_cbam_gsconvns_gsbottleneck.yaml

# ───────────────────────────
# Global parameters
# ───────────────────────────
nc: 80         # number of classes

scales:        # compound scaling factors  [depth, width, max_channels]
  n: [0.50, 0.25, 1024]   # 181 layers, 2.6 M params, 6.6 GFLOPs
  s: [0.50, 0.50, 1024]   # 181 layers, 9.5 M params, 21.7 GFLOPs
  m: [0.50, 1.00,  512]   # 231 layers, 20.1 M params, 68.5 GFLOPs
  l: [1.00, 1.00,  512]   # 357 layers, 25.3 M params, 87.6 GFLOPs
  x: [1.00, 1.50,  512]   # 357 layers, 56.9 M params, 196 GFLOPs

# ───────────────────────────
# Backbone
# ───────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,      [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv,      [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2,      [256, False, 0.25]]   # 2
  - [-1, 1, Conv,      [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2,      [512, False, 0.25]]   # 4
  - [-1, 1, Conv,      [512, 3, 2]]          # 5  P4/16
  - [-1, 2, C3k2,      [512, True]]          # 6
  - [-1, 1, Conv,      [1024, 3, 2]]         # 7  P5/32
  - [-1, 2, C3k2,      [1024, True]]         # 8
  - [-1, 1, SPPF,      [1024, 5]]            # 9
  - [-1, 2, C2PSA,     [1024]]               # 10
  - [-1, 1, CBAM,      [512]]                # 11

# ───────────────────────────
# Head / Neck
# ───────────────────────────
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 12
  - [[-1, 6], 1, Concat, [1]]                        # 13
  - [-1, 2, GSBottleneck, [512]]                    # 14  (was [512, False])
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 15
  - [[-1, 4], 1, Concat, [1]]                        # 16
  - [-1, 2, GSBottleneck, [256]]                    # 17  (P3/8)
  - [-1, 1, GSConvns,    [256, 3, 2]]                # 18
  - [[-1, 14], 1, Concat, [1]]                       # 19
  - [-1, 2, GSBottleneck, [512]]                    # 20  (P4/16)
  - [-1, 1, GSConvns,    [512, 3, 2]]                # 21
  - [[-1, 11], 1, Concat, [1]]                       # 22
  - [-1, 2, GSBottleneck, [1024]]                   # 23  (P5/32)
  - [[17, 20, 23], 1, Detect, [nc]]                  # 24